[package]
name = "pq-account"
version = "0.1.0"
edition = "2021"
publish = false
description = "A minimal post-quantum smart account for Stellar: ML-DSA-65 signatures checked with CAP-87 host functions."
license = "Apache-2.0"

[workspace]
members = [".", "ed25519-account"]
resolver = "2"
dependencies = {soroban-sdk = {version = "30.0.0-rc.1", default-features = false, features = ["alloc", "hazmat-address"]}, cvlr = {git = "https://github.com/Certora/cvlr", branch = "0.6.1-soroban-changes", default-features = false}, cvlr-soroban = {path = "/Users/julian/git/pq-wallet-tour/cvlr-soroban/cvlr-soroban", default-features = false, features = ["muxedaddress"]}, cvlr-soroban-derive = {path = "/Users/julian/git/pq-wallet-tour/cvlr-soroban/cvlr-soroban-derive", default-features = false}}

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = {workspace = true, default-features = false}
cvlr = {workspace = true, default-features = false}
cvlr-soroban = {workspace = true, default-features = false}
cvlr-soroban-derive = {workspace = true, default-features = false}

[dev-dependencies]
soroban-sdk = { version = "=30.0.0-rc.1", features = ["testutils"] }
# Signing in tests only. The contract itself only verifies, through the host.
ml-dsa = { version = "0.1.2", default-features = false, features = ["alloc"] }
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
opt-level = 2
debug = 2
strip = false
lto = true
overflow-checks = true
inherits = "release"
